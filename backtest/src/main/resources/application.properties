quarkus.application.name=polymarket-bot-backtest
quarkus.http.port=8083
polymarket.trading.mode=backtest
quarkus.index-dependency.common.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.common.artifact-id=common
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED

# Collector Historical Parquet Archive Directory, CLOB Execution Gateway & DuckDB Configuration
polymarket.backtest.collector-dir=/data/polymarket/collector
polymarket.backtest.order-gateway-delay-ms=220
polymarket.backtest.duckdb.memory-limit=6GB
polymarket.backtest.duckdb.threads=4
polymarket.backtest.duckdb.temp-dir=/tmp/polymarket-duckdb

# Simulated CEX Exchange Feed Delays (milliseconds added to server timestamp)
backtest.binance.delay-ms=100
backtest.kraken.delay-ms=50
backtest.coinbase.delay-ms=50

# Backtest Execution Mode & Default Parameters
polymarket.backtest.batchMode=false
polymarket.backtest.strategy=OraclePulseLockStrategy
polymarket.backtest.initial-capital=10000.0
polymarket.backtest.from=2026-10-12
polymarket.backtest.history-db-path=${user.home}/.local/share/polymarket-bot/backtest-history.duckdb

# Test profile overrides
%test.polymarket.backtest.batchMode=false
%test.polymarket.backtest.collector-dir=src/test/resources/data
%test.polymarket.backtest.duckdb.memory-limit=256MB
%test.polymarket.backtest.duckdb.threads=1
%test.polymarket.backtest.duckdb.temp-dir=target/test-data/duckdb-tmp
%test.polymarket.backtest.history-db-path=target/test-data/Polymarket/backtesting/backtest-history.duckdb

# SmallRye OpenAPI and Swagger UI Configuration
quarkus.smallrye-openapi.info-title=Polymarket Bot - Backtest API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for the backtesting simulation engine.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Console and File Logging Configuration
# Pattern: <datetime> [<logLevel>] <loggerName> <message>
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} [%p] %c %s%e%n

quarkus.log.file.enabled=true
quarkus.log.file.path=logs/backtest/backtest.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} [%p] %c %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=10
quarkus.log.file.rotation.rotate-on-boot=true

# Suppress repetitive per-market INFO logs from common strategies during batch backtests
quarkus.log.category."cz.polymarket.bot.strategy".level=WARN

# Disable file logging in test profile to prevent polluting logs during test runs
%test.quarkus.log.file.enabled=false
