quarkus.application.name=polymarket-bot-backtest
quarkus.http.port=8083
polymarket.trading.mode=backtest

# Historical Market Data Directory Configuration
polymarket.data.base-dir=D:\\Crypto\\data\\Polymarket\\Binance

# Test profile overrides
%test.polymarket.data.base-dir=target/test-data/Polymarket/Binance

# SmallRye OpenAPI and Swagger UI Configuration
quarkus.smallrye-openapi.info-title=Polymarket Bot - Backtest API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for the backtesting simulation engine.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

