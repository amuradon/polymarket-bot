quarkus.application.name=polymarket-bot-backtest
quarkus.http.port=8083
polymarket.trading.mode=backtest

# Historical Data Download Configuration
polymarket.data.base-dir=D:\\Crypto\\data\\Polymarket\\Binance
polymarket.data.binance.spot-trades-url=https://data.binance.vision/data/spot/daily/aggTrades
polymarket.data.binance.futures-trades-url=https://data.binance.vision/data/futures/um/daily/aggTrades
polymarket.data.cryptohftdata.base-url=https://api.cryptohftdata.com/v1
polymarket.data.cryptohftdata.api-key=${CRYPTOHFTDATA_API_KEY:}

# Test profile overrides
%test.polymarket.data.base-dir=target/test-data/Polymarket/Binance

# SmallRye OpenAPI and Swagger UI Configuration
quarkus.smallrye-openapi.info-title=Polymarket Bot - Backtest & Data Ingestion API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for the backtesting simulation engine and Binance historical daily market data ingestion (spot aggTrades, futures aggTrades, and futures orderbook).
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

