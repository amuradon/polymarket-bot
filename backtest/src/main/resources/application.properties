quarkus.application.name=polymarket-bot-backtest
quarkus.http.port=8083
polymarket.trading.mode=backtest
quarkus.index-dependency.common.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.common.artifact-id=common

# Collector Historical Parquet Archive Directory, DuckDB & Worker Pool Configuration
polymarket.backtest.collector-dir=D:\\Crypto\\data\\Polymarket\\collector
polymarket.backtest.latency-factor=1.0
polymarket.backtest.duckdb.memory-limit=512MB
polymarket.backtest.workers=4

# Test profile overrides
%test.polymarket.backtest.collector-dir=src/test/resources/data
%test.polymarket.backtest.output-dir=target/test-data/Polymarket/backtesting
%test.polymarket.backtest.workers=2

# SmallRye OpenAPI and Swagger UI Configuration
quarkus.smallrye-openapi.info-title=Polymarket Bot - Backtest API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for the backtesting simulation engine.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Console and File Logging Configuration
# Pattern: <datetime> <logLevel> <loggerName> <message>
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %p %c %s%e%n

quarkus.log.file.enabled=true
quarkus.log.file.path=logs/backtest/backtest.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %p %c %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=10
quarkus.log.file.rotation.rotate-on-boot=true

# Suppress repetitive per-market INFO logs from common strategies during batch backtests
quarkus.log.category."cz.polymarket.bot.strategy".level=WARN

# Disable file logging in test profile to prevent polluting logs during test runs
%test.quarkus.log.file.enabled=false
