quarkus.application.name=polymarket-bot
quarkus.http.port=${PORT:8080}

# Quarkus CDI / Jandex indexing for multi-module reactor builds
quarkus.index-dependency.common.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.common.artifact-id=common
quarkus.index-dependency.connector.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.connector.artifact-id=connector
quarkus.arc.remove-unused-beans=fwk

# Dedicated 1 EventLoop thread for control/user I/O (vCPU #0) + Native Linux Epoll & Java 25 native access
quarkus.vertx.event-loops-pool-size=1
quarkus.vertx.prefer-native-transport=true
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED

# Logging Configuration (Production default: INFO, min-level: TRACE, bracketed level [%p])
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} [%p] [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.min-level=TRACE
quarkus.log.category."cz.polymarket.bot".level=INFO
quarkus.log.category."cz.polymarket.bot".min-level=TRACE

# Unified Runtime, Strategy Mode (LIVE | PAPER | OFF) & State Persistence
polymarket.strategy.mode=${POLYMARKET_STRATEGY_MODE:LIVE}
polymarket.strategy.name=${POLYMARKET_STRATEGY_NAME:UtterParameciumStrategy}
polymarket.runtime.state-file=${POLYMARKET_STATE_FILE:data/state/runtime-state.json}

# Strategy Trading Engine Configuration (shared across LIVE & PAPER)
polymarket.trading.symbol=${POLYMARKET_SYMBOL:BTCUSDT}
polymarket.trading.timeframe=${POLYMARKET_TIMEFRAME:15m}
polymarket.trading.streams-enabled=${POLYMARKET_STREAMS_ENABLED:true}
polymarket.trading.order-type=${POLYMARKET_ORDER_TYPE:FAK}
polymarket.trading.max-quote-age-ms=${POLYMARKET_MAX_QUOTE_AGE_MS:250}
polymarket.trading.discovery-interval=5s
polymarket.trading.keepalive-interval=15s

# Paper Trading Execution & Persistence Configuration
polymarket.paper.data-dir=${POLYMARKET_PAPER_DATA_DIR:data/paper}
polymarket.paper.initial-capital=${POLYMARKET_PAPER_INITIAL_CAPITAL:10000.0}
polymarket.paper.order-latency-ms=${POLYMARKET_PAPER_ORDER_LATENCY_MS:50}

# Market Data Collector Configuration (PolyBolt + CLOB active; Binance bookTicker preserved & inactive)
polymarket.collector.streams-enabled=${POLYMARKET_COLLECTOR_STREAMS_ENABLED:true}
polymarket.collector.symbol=${POLYMARKET_SYMBOL:BTCUSDT}
polymarket.collector.timeframe=${POLYMARKET_TIMEFRAME:15m}
polymarket.collector.data-dir=${POLYMARKET_COLLECTOR_DATA_DIR:data/collector}
polymarket.collector.lookahead-count=${POLYMARKET_COLLECTOR_LOOKAHEAD_COUNT:2}
polymarket.collector.binance.spot-book-ticker-enabled=${POLYMARKET_COLLECTOR_BINANCE_SPOT_BOOK_TICKER_ENABLED:false}
polymarket.collector.binance.futures-book-ticker-enabled=${POLYMARKET_COLLECTOR_BINANCE_FUTURES_BOOK_TICKER_ENABLED:false}
polymarket.collector.discovery-interval=30s
polymarket.collector.flush-interval=5s

# Quarkus Amazon Secrets Manager (quarkus-amazon-secretsmanager)
quarkus.secretsmanager.devservices.enabled=false
%prod.quarkus.secretsmanager.aws.region=eu-west-1
%prod.quarkus.secretsmanager.aws.credentials.type=default
%prod.quarkus.secretsmanager.config.enabled=true
%prod.quarkus.secretsmanager.config.secrets."polymarket.secrets"=polymarket-sniper/clob-credentials
%dev.quarkus.secretsmanager.config.enabled=false
%test.quarkus.secretsmanager.config.enabled=false

# Connector Credentials & Endpoints
polymarket.connector.signer-key=${polymarket.secrets.signer_key:}
polymarket.connector.api-key=${polymarket.secrets.api_key:}
polymarket.connector.passphrase=${polymarket.secrets.passphrase:}
polymarket.connector.secret=${polymarket.secrets.secret:}
polymarket.connector.address=${polymarket.secrets.address:}
polymarket.connector.signer-address=${polymarket.secrets.signer_address:}
polymarket.connector.gamma.base-url=https://gamma-api.polymarket.com
polymarket.connector.clob.rest-url=https://clob.polymarket.com
polymarket.connector.clob.ws-url=wss://ws-subscriptions-clob.polymarket.com/ws/market
polymarket.connector.polybolt.ws-url=wss://ws-live-v2.polymarket.com/ws
polymarket.connector.binance.spot-ws-base-url=wss://stream.binance.com:9443/ws
polymarket.connector.binance.futures-ws-base-url=wss://fstream.binance.com
polymarket.connector.kraken.spot-ws-url=wss://ws.kraken.com/v2
polymarket.connector.coinbase.spot-ws-url=wss://ws-feed.exchange.coinbase.com
polymarket.connector.ws.reconnect-delay-ms=3000
polymarket.connector.ws.ping-interval-ms=10000

# Test profile overrides (100% synthetic, offline)
%test.quarkus.http.test-port=0
%test.quarkus.scheduler.enabled=false
%test.polymarket.trading.streams-enabled=false
%test.polymarket.collector.streams-enabled=false
%test.polymarket.collector.data-dir=target/test-collector-data
%test.polymarket.paper.data-dir=target/test-paper-data
%test.polymarket.runtime.state-file=target/test-state/runtime-state.json
