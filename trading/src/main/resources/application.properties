quarkus.application.name=polymarket-bot
quarkus.http.port=8080

# Quarkus CDI / Jandex indexing for multi-module reactor builds (release:prepare & IDE resilience)
quarkus.index-dependency.common.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.common.artifact-id=common
quarkus.index-dependency.connector.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.connector.artifact-id=connector

# Disable Secrets Manager DevServices in trading module
quarkus.secretsmanager.devservices.enabled=false
quarkus.secretsmanager.config.enabled=false

# Exchange WebSocket endpoints
polymarket.exchange.binance.ws-url=wss://stream.binance.com:9443/ws/btcusdt@ticker
polymarket.exchange.binance.rest-url=https://api.binance.com/api/v3
polymarket.exchange.coinbase.ws-url=wss://ws-feed.exchange.coinbase.com
polymarket.exchange.kraken.ws-url=wss://ws.kraken.com/v2

# Default timeframe
polymarket.twap.default-timeframe=5m

# Cache duration in seconds (1 hour = 3600 seconds)
polymarket.twap.cache-seconds=3600

# Chart Y-axis default range per symbol and timeframe
polymarket.chart.btc-usd.5m.y-range=30
polymarket.chart.btc-usd.15m.y-range=50

# Chart X-axis default range in whole minutes per symbol and timeframe
polymarket.chart.btc-usd.5m.x-range-minutes=5
polymarket.chart.btc-usd.15m.x-range-minutes=5

# Test profile overrides (100% synthetic, offline)
%test.quarkus.http.test-port=0
%test.polymarket.strategy.name=UtterParameciumStrategy
