<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC-USD TWAP Console</title>
    <!-- HTMX, jQuery, LightweightCharts v5 -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@5.0.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-primary: #12141c;
            --bg-secondary: #1a1d28;
            --bg-card: #202433;
            --border-color: #2b3145;
            --text-primary: #f0f3fa;
            --text-secondary: #848e9c;
            --accent-blue: #2962ff;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --accent-orange: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(14, 203, 129, 0.15);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-live::before {
            content: "";
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .timeframe-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .timeframe-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        select#timeframe-select {
            background: transparent;
            color: var(--text-primary);
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            padding: 2px 4px;
        }

        select#timeframe-select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        main {
            flex: 1;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-title {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .chart-wrapper {
            position: relative;
            flex: 1;
            min-height: 520px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        #chart-container {
            width: 100%;
            height: 100%;
            min-height: 520px;
        }

        #chart-legend {
            position: absolute;
            top: 14px;
            left: 16px;
            z-index: 10;
            background: rgba(26, 29, 40, 0.85);
            backdrop-filter: blur(6px);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            pointer-events: none;
            font-size: 13px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .legend-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .legend-name {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
        }

        .legend-val {
            font-size: 14px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .text-blue { color: var(--accent-blue); }
        .text-orange { color: var(--accent-orange); }
        .text-green { color: var(--accent-green); }
        .text-red { color: var(--accent-red); }

        footer {
            padding: 12px 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>BTC-USD TWAP Console</h1>
            <span class="badge-live" id="ws-status">CONNECTED</span>
        </div>
        <div class="controls">
            <div class="timeframe-wrapper">
                <span class="timeframe-label">Candle Timeframe:</span>
                <select id="timeframe-select" name="timeframe">
                    <option value="5m" {#if selectedTimeframe == "5m"}selected{/if}>5m (Default)</option>
                    <option value="15m" {#if selectedTimeframe == "15m"}selected{/if}>15m</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <div class="stats-bar">
            <div class="stat-card">
                <span class="stat-title">Current TWAP</span>
                <span class="stat-value text-blue" id="stat-twap">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Candle Open Price</span>
                <span class="stat-value text-orange" id="stat-open">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Latest 1s Median</span>
                <span class="stat-value text-green" id="stat-median">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Candle Interval</span>
                <span class="stat-value" id="stat-interval" style="font-size: 14px; padding-top: 4px;">-</span>
            </div>
        </div>

        <div class="chart-wrapper">
            <div id="chart-legend">
                <div class="legend-item">
                    <span class="legend-name">Time</span>
                    <span class="legend-val" id="legend-time">-</span>
                </div>
                <div class="legend-item">
                    <span class="legend-name">TWAP</span>
                    <span class="legend-val text-blue" id="legend-twap">-</span>
                </div>
                <div class="legend-item">
                    <span class="legend-name">Open</span>
                    <span class="legend-val text-orange" id="legend-open">-</span>
                </div>
                <div class="legend-item">
                    <span class="legend-name">1s Median</span>
                    <span class="legend-val text-green" id="legend-median">-</span>
                </div>
                <div class="legend-item">
                    <span class="legend-name">Diff (TWAP - Open)</span>
                    <span class="legend-val" id="legend-diff">-</span>
                </div>
            </div>
            <div id="chart-container"></div>
        </div>
    </main>

    <footer>
        Aggregated BTC TWAP (Binance, Coinbase, Kraken 1s snapshot median) &bull; Java 25 &bull; Quarkus
    </footer>

    <script>
        $(document).ready(function() {
            let activeTimeframe = $('#timeframe-select').val() || '5m';
            let chart = null;
            let twapSeries = null;
            let openPriceLine = null;
            let currentOpenPrice = 0;
            let latestPoint = null;
            let ws = null;

            // Formatter for currency
            const priceFormatter = (val) => {
                if (val === null || val === undefined || isNaN(val)) return '-';
                return '$' + parseFloat(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            };

            const timeFormatter = (epochSec) => {
                if (!epochSec) return '-';
                const d = new Date(epochSec * 1000);
                return d.toISOString().substring(11, 19) + ' UTC';
            };

            // Initialize TradingView Lightweight Chart (v5 API)
            const chartContainer = document.getElementById('chart-container');
            chart = LightweightCharts.createChart(chartContainer, {
                autoSize: true,
                layout: {
                    background: { type: 'solid', color: '#1a1d28' },
                    textColor: '#848e9c',
                    fontSize: 12
                },
                grid: {
                    vertLines: { color: 'rgba(43, 49, 69, 0.4)' },
                    horzLines: { color: 'rgba(43, 49, 69, 0.4)' }
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: '#2b3145',
                    scaleMargins: { top: 0.1, bottom: 0.1 },
                },
                timeScale: {
                    borderColor: '#2b3145',
                    timeVisible: true,
                    secondsVisible: true,
                },
                localization: {
                    priceFormatter: priceFormatter
                }
            });

            // Add TWAP series (v5 syntax)
            twapSeries = chart.addSeries(LightweightCharts.LineSeries, {
                color: '#2962ff',
                lineWidth: 2,
                title: 'TWAP',
                priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
            });

            // Update top-left legend
            function updateLegend(timeSec, twapVal, medianVal) {
                $('#legend-time').text(timeFormatter(timeSec));
                $('#legend-twap').text(priceFormatter(twapVal));
                $('#legend-open').text(priceFormatter(currentOpenPrice));
                $('#legend-median').text(priceFormatter(medianVal));

                if (twapVal !== null && currentOpenPrice > 0) {
                    const diff = twapVal - currentOpenPrice;
                    const pct = (diff / currentOpenPrice) * 100;
                    const sign = diff >= 0 ? '+' : '';
                    const colorClass = diff >= 0 ? 'text-green' : 'text-red';
                    $('#legend-diff').attr('class', 'legend-val ' + colorClass)
                                     .text(sign + diff.toFixed(2) + ' (' + sign + pct.toFixed(2) + '%)');
                } else {
                    $('#legend-diff').attr('class', 'legend-val').text('-');
                }
            }

            // Crosshair hover subscription
            chart.subscribeCrosshairMove(function(param) {
                if (!param || param.time === undefined || !param.seriesData) {
                    if (latestPoint) {
                        updateLegend(latestPoint.time, latestPoint.twap, latestPoint.medianPrice);
                    }
                    return;
                }
                const twapData = param.seriesData.get(twapSeries);
                if (twapData && twapData.value !== undefined) {
                    updateLegend(param.time, twapData.value, twapData.medianPrice || twapData.value);
                }
            });

            // Update open price horizontal line
            function setOpenPriceLine(price) {
                currentOpenPrice = price;
                if (openPriceLine) {
                    twapSeries.removePriceLine(openPriceLine);
                    openPriceLine = null;
                }
                if (price && price > 0) {
                    openPriceLine = twapSeries.createPriceLine({
                        price: parseFloat(price),
                        color: '#f59e0b',
                        lineWidth: 2,
                        lineStyle: LightweightCharts.LineStyle.Dashed,
                        axisLabelVisible: true,
                        title: 'OPEN'
                    });
                }
                $('#stat-open').text(priceFormatter(price));
            }

            // Fetch initial candle data from REST API
            function loadCandleData(tf) {
                $.getJSON('/api/twap?timeframe=' + tf, function(data) {
                    if (!data) return;

                    setOpenPriceLine(data.openPrice);

                    const startTimeStr = new Date(data.candleStart * 1000).toISOString().substring(11, 19);
                    const endTimeStr = new Date(data.candleEnd * 1000).toISOString().substring(11, 19);
                    $('#stat-interval').text(startTimeStr + ' - ' + endTimeStr + ' UTC (' + tf + ')');

                    if (data.points && data.points.length > 0) {
                        const chartPoints = data.points.map(function(p) {
                            return {
                                time: p.time,
                                value: parseFloat(p.twap),
                                medianPrice: parseFloat(p.medianPrice)
                            };
                        });
                        twapSeries.setData(chartPoints);
                        chart.timeScale().fitContent();

                        latestPoint = chartPoints[chartPoints.length - 1];
                        $('#stat-twap').text(priceFormatter(latestPoint.value));
                        $('#stat-median').text(priceFormatter(latestPoint.medianPrice));
                        updateLegend(latestPoint.time, latestPoint.value, latestPoint.medianPrice);
                    } else {
                        twapSeries.setData([]);
                    }
                }).fail(function(err) {
                    console.error('Error loading candle data:', err);
                });
            }

            // Setup WebSocket connection to /ws/twap
            function connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = protocol + '//' + window.location.host + '/ws/twap';

                ws = new WebSocket(wsUrl);

                ws.onopen = function() {
                    $('#ws-status').text('CONNECTED').css('color', 'var(--accent-green)');
                    // Send active timeframe subscription
                    ws.send(JSON.stringify({ action: 'setTimeframe', timeframe: activeTimeframe }));
                };

                ws.onmessage = function(event) {
                    try {
                        const msg = JSON.parse(event.data);
                        if (!msg || msg.timeframe !== activeTimeframe) {
                            return;
                        }

                        if (msg.isNewCandle) {
                            // New candle rollover: clear old candle data from chart
                            twapSeries.setData([]);
                            setOpenPriceLine(msg.openPrice);
                            const startTimeStr = new Date(msg.candleStart * 1000).toISOString().substring(11, 19);
                            const endTimeStr = new Date(msg.candleEnd * 1000).toISOString().substring(11, 19);
                            $('#stat-interval').text(startTimeStr + ' - ' + endTimeStr + ' UTC (' + msg.timeframe + ')');
                        }

                        if (msg.point) {
                            const newPoint = {
                                time: msg.point.time,
                                value: parseFloat(msg.point.twap),
                                medianPrice: parseFloat(msg.point.medianPrice)
                            };
                            twapSeries.update(newPoint);
                            latestPoint = newPoint;

                            $('#stat-twap').text(priceFormatter(newPoint.value));
                            $('#stat-median').text(priceFormatter(newPoint.medianPrice));
                            updateLegend(newPoint.time, newPoint.value, newPoint.medianPrice);
                        }
                    } catch (e) {
                        console.error('Error processing websocket message:', e);
                    }
                };

                ws.onclose = function() {
                    $('#ws-status').text('DISCONNECTED').css('color', 'var(--accent-red)');
                    setTimeout(connectWebSocket, 3000);
                };

                ws.onerror = function(err) {
                    console.error('WebSocket error:', err);
                    ws.close();
                };
            }

            // Handle timeframe dropdown switch
            $('#timeframe-select').on('change', function() {
                activeTimeframe = $(this).val();
                loadCandleData(activeTimeframe);
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ action: 'setTimeframe', timeframe: activeTimeframe }));
                }
            });

            // Initial load
            loadCandleData(activeTimeframe);
            connectWebSocket();
        });
    </script>
</body>
</html>
