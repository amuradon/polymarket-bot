quarkus.application.name=polymarket-bot-data-collector
quarkus.http.port=${PORT:8084}

# Quarkus CDI / Jandex indexing for multi-module reactor builds
quarkus.index-dependency.common.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.common.artifact-id=common
quarkus.index-dependency.connector.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.connector.artifact-id=connector

# Native Linux Epoll transport
quarkus.vertx.prefer-native-transport=true

# Logging Configuration (Production default: INFO, min-level: TRACE)
quarkus.log.level=INFO
quarkus.log.min-level=TRACE
quarkus.log.category."cz.polymarket.bot".level=INFO
quarkus.log.category."cz.polymarket.bot".min-level=TRACE

# Collector configuration
polymarket.collector.symbol=${POLYMARKET_COLLECTOR_SYMBOL:BTCUSDT}
polymarket.collector.timeframe=${POLYMARKET_COLLECTOR_TIMEFRAME:15m}
polymarket.collector.data-dir=${POLYMARKET_COLLECTOR_DATA_DIR:data/collector}
polymarket.collector.lookahead-count=${POLYMARKET_COLLECTOR_LOOKAHEAD_COUNT:5}
polymarket.collector.discovery-interval=30s
polymarket.collector.flush-interval=5s

# Quarkus Amazon Secrets Manager (quarkus-amazon-secretsmanager)
quarkus.secretsmanager.devservices.enabled=false
%prod.quarkus.secretsmanager.region=eu-west-1
%prod.quarkus.secretsmanager.aws.credentials.type=default
%prod.quarkus.secretsmanager.config.enabled=true
%prod.quarkus.secretsmanager.config.secrets."polymarket.secrets"=polymarket-sniper/clob-credentials
%prod.quarkus.secretsmanager.config.secrets."deribit.secrets"=polymarket-sniper/deribit-credentials
%dev.quarkus.secretsmanager.config.enabled=false
%test.quarkus.secretsmanager.config.enabled=false

# Connector endpoints and Polymarket / Deribit API credentials
polymarket.connector.binance.spot-ws-base-url=wss://stream.binance.com:9443/ws
polymarket.connector.binance.futures-ws-base-url=wss://fstream.binance.com
polymarket.connector.deribit.ws-url=wss://www.deribit.com/ws/api/v2
polymarket.connector.deribit.client-id=${deribit.secrets.client_id}
polymarket.connector.deribit.client-secret=${deribit.secrets.client_secret}
polymarket.connector.gamma.base-url=https://gamma-api.polymarket.com
polymarket.connector.polybolt.ws-url=wss://ws-live-v2.polymarket.com/ws
polymarket.connector.clob.ws-url=wss://ws-subscriptions-clob.polymarket.com/ws/market
polymarket.connector.api-key=${polymarket.secrets.api_key}
polymarket.connector.secret=${polymarket.secrets.secret}
polymarket.connector.passphrase=${polymarket.secrets.passphrase}
polymarket.connector.ws.reconnect-delay-ms=3000
polymarket.connector.ws.ping-interval-ms=15000

# Test configuration
%test.quarkus.http.test-port=0
%test.polymarket.collector.data-dir=target/test-collector-data
%test.polymarket.connector.deribit.client-id=test-deribit-client-id
%test.polymarket.connector.deribit.client-secret=test-deribit-client-secret
%test.polymarket.connector.api-key=test-api-key
%test.polymarket.connector.secret=test-secret
%test.polymarket.connector.passphrase=test-passphrase
