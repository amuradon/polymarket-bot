AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Polymarket Bot Live Trading infrastructure in eu-west-1 (Dublin). Provisions an ECR repository,
  CloudWatch Logs group, least-privilege IAM role with SSM Session Manager, CloudWatch Logs, and
  Secrets Manager access to polymarket-sniper/clob-credentials, encrypted gp3 EBS volume for
  persistent live trade history, and a 24/7 c8g.large EC2 instance (Graviton4 ARM64).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  InstanceType:
    Type: String
    Default: c8g.large
    Description: EC2 instance type (arm64 / Graviton4) for running the Dockerized Quarkus Live Trading Engine.

  EbsVolumeSizeGb:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 1000
    Description: Size in GiB of the persistent gp3 EBS volume mounted at /mnt/ebs/polymarket-data.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Latest Amazon Linux 2023 arm64 AMI ID from SSM Parameter Store.

  PolymarketSecretId:
    Type: String
    Default: polymarket-sniper/clob-credentials
    Description: AWS Secrets Manager secret ID storing Polymarket CLOB L2 and EIP-712 signing credentials.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: Retention period in days for the CloudWatch Logs log group.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0ebc7d75fbfa0bf7f
    Description: VPC ID in eu-west-1 for the Live Trading security group and instance.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0b1537e6f83a86b05
    Description: Public subnet ID in eu-west-1a for the Live Trading EC2 instance.

Resources:
  LiveTradingEcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores versioned Docker images for the Polymarket Bot Live Trading Quarkus application.
        must: Keep image scanning enabled and retain repository across stack updates.
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-repo"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  LiveTradingLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Centralized CloudWatch Logs log group for the Live Trading Docker container (awslogs driver) and EC2 host logs.
        must: Retain logs across stack updates and enforce a bounded retention period.
    Properties:
      LogGroupName: !Sub "/polymarket-bot/${AWS::StackName}/live-trading"
      RetentionInDays: !Ref LogRetentionDays

  LiveTradingSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Zero-inbound security group for the Live Trading daemon; management and dashboard port forwarding use AWS Systems Manager (SSM) and all market/CLOB operations use outbound WSS/HTTPS.
        must: Do not open inbound SSH port 22 to the internet; allow outbound HTTPS (443) for Polymarket CLOB, Gamma, PolyBolt, ECR, SSM, CloudWatch Logs, and Secrets Manager.
    Properties:
      GroupDescription: Zero-inbound security group for Polymarket Live Trading EC2 instance
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound traffic for Polymarket CLOB/Gamma/PolyBolt (443), ECR, SSM, CloudWatch Logs, and Secrets Manager

  LiveTradingIamRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Allows the EC2 instance to be managed via SSM Session Manager/Run Command, stream container/host logs to CloudWatch Logs, pull images from ECR, and read Polymarket CLOB & EIP-712 signing credentials from Secrets Manager via quarkus-amazon-secretsmanager.
        must: Scope Secrets Manager GetSecretValue permission strictly to the PolymarketSecretId prefix in eu-west-1 and CloudWatch Logs write permissions to LiveTradingLogGroup.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: LiveTradingEcrSecretsAndCloudWatchAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuthToken
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPullLiveTradingImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt LiveTradingEcrRepository.Arn
              - Sid: ListSecretsForQuarkusSecretsManagerConfigSource
                Effect: Allow
                Action:
                  - secretsmanager:ListSecrets
                Resource: '*'
              - Sid: ReadPolymarketCredentialsSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${PolymarketSecretId}*"
              - Sid: WriteContainerAndHostLogsToCloudWatch
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt LiveTradingLogGroup.Arn
              - Sid: EbsAttachAndDescribe
                Effect: Allow
                Action:
                  - ec2:DescribeVolumes
                  - ec2:AttachVolume
                Resource: '*'

  LiveTradingInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Metadata:
      com.aws.cloudformation.Context:
        why: Binds the LiveTradingIamRole to the EC2 instance.
        must: Reference LiveTradingIamRole.
    Properties:
      Roles:
        - !Ref LiveTradingIamRole

  LiveTradingEbsVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Dedicated persistent gp3 EBS volume for storing live trades.jsonl and metrics.json separately from the root OS volume.
        must: Must be encrypted, gp3, retained on stack deletion, and created in the same Availability Zone as the EC2 instance.
        mutability: immutable
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      VolumeType: gp3
      Size: !Ref EbsVolumeSizeGb
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ebs-live"

  LiveTradingInstance:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: 24/7 c8g.large EC2 host in eu-west-1 running the Dockerized Quarkus Live Trading Engine with CloudWatch logging and IMDSv2 hop limit 2 for container metadata access.
        must: Enforce IMDSv2 (HttpTokens required, HttpPutResponseHopLimit 2) and ship container and host logs to CloudWatch Logs.
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      AvailabilityZone: !Sub "${AWS::Region}a"
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref LiveTradingInstanceProfile
      SecurityGroupIds:
        - !GetAtt LiveTradingSecurityGroup.GroupId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y docker jq awscli amazon-cloudwatch-agent

          # Configure Docker daemon to stream container logs to CloudWatch Logs by default
          mkdir -p /etc/docker
          cat << 'EOF' > /etc/docker/daemon.json
          {
            "log-driver": "awslogs",
            "log-opts": {
              "awslogs-region": "${AWS::Region}",
              "awslogs-group": "${LiveTradingLogGroup}",
              "awslogs-create-stream": "true"
            }
          }
          EOF

          systemctl enable --now docker
          usermod -aG docker ec2-user || true

          # Configure Amazon CloudWatch Agent for host bootstrap and system logs
          mkdir -p /opt/aws/amazon-cloudwatch-agent/etc
          cat << 'EOF' > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/cloud-init-output.log",
                      "log_group_name": "${LiveTradingLogGroup}",
                      "log_stream_name": "{instance_id}/cloud-init-output"
                    },
                    {
                      "file_path": "/var/log/messages",
                      "log_group_name": "${LiveTradingLogGroup}",
                      "log_stream_name": "{instance_id}/messages"
                    }
                  ]
                }
              }
            }
          }
          EOF
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config -m ec2 \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

          # Retrieve IMDSv2 token, Instance ID, and Region
          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
          AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
          REGION=$(echo "$AZ" | sed 's/[a-z]$//')

          # Attach the persistent gp3 EBS volume when available
          for i in $(seq 1 60); do
            VOL_STATE=$(aws ec2 describe-volumes --region "$REGION" --volume-ids "${LiveTradingEbsVolume}" --query "Volumes[0].State" --output text || true)
            if [ "$VOL_STATE" = "available" ]; then
              aws ec2 attach-volume --region "$REGION" --volume-id "${LiveTradingEbsVolume}" --instance-id "$INSTANCE_ID" --device /dev/sdf || true
              break
            elif [ "$VOL_STATE" = "in-use" ]; then
              ATTACHED_ID=$(aws ec2 describe-volumes --region "$REGION" --volume-ids "${LiveTradingEbsVolume}" --query "Volumes[0].Attachments[0].InstanceId" --output text || true)
              if [ "$ATTACHED_ID" = "$INSTANCE_ID" ]; then
                break
              fi
            fi
            sleep 2
          done

          # Wait for the attached secondary EBS volume (/dev/sdf -> nvme1n1 on Nitro)
          DATA_DEV=""
          for i in $(seq 1 30); do
            for candidate in /dev/nvme1n1 /dev/xvdf /dev/sdf; do
              if [ -b "$candidate" ]; then
                ROOT_DEV=$(findmnt -n -o SOURCE / | sed 's/p[0-9]*$//')
                if [ "$candidate" != "$ROOT_DEV" ]; then
                  DATA_DEV="$candidate"
                  break 2
                fi
              fi
            done
            sleep 2
          done

          mkdir -p /mnt/ebs/polymarket-data/live
          if [ -n "$DATA_DEV" ]; then
            if ! blkid "$DATA_DEV"; then
              mkfs.xfs "$DATA_DEV"
            fi
            UUID=$(blkid -s UUID -o value "$DATA_DEV")
            if ! grep -q "$UUID" /etc/fstab; then
              echo "UUID=$UUID /mnt/ebs/polymarket-data xfs defaults,nofail 0 2" >> /etc/fstab
            fi
            mount -a
          fi

          mkdir -p /mnt/ebs/polymarket-data/live
          chown -R 185:185 /mnt/ebs/polymarket-data
          chmod -R 775 /mnt/ebs/polymarket-data

          # Create helper launch script for 24/7 container execution with CloudWatch Logs and AWS Secrets Manager integration
          cat << 'EOF' > /usr/local/bin/start-polymarket-live.sh
          #!/bin/bash
          set -euo pipefail
          IMAGE_URI="${1:-polymarket-bot/live:latest}"
          DRY_RUN="${2:-false}"
          docker rm -f polymarket-live || true
          docker run -d \
            --name polymarket-live \
            --restart unless-stopped \
            --log-driver=awslogs \
            --log-opt awslogs-region="${AWS::Region}" \
            --log-opt awslogs-group="${LiveTradingLogGroup}" \
            --log-opt awslogs-stream="polymarket-live" \
            --log-opt awslogs-create-stream="true" \
            -p 8084:8084 \
            -v /mnt/ebs/polymarket-data:/mnt/ebs/polymarket-data \
            -e QUARKUS_PROFILE="prod" \
            -e AWS_REGION="${AWS::Region}" \
            -e POLYMARKET_CREDENTIALS_SECRET_ID="${PolymarketSecretId}" \
            -e POLYMARKET_STRATEGY_NAME="UtterParameciumStrategy" \
            -e POLYMARKET_LIVE_DRY_RUN="$DRY_RUN" \
            "$IMAGE_URI"
          EOF
          chmod +x /usr/local/bin/start-polymarket-live.sh
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance"

Outputs:
  InstanceId:
    Description: EC2 Instance ID of the Live Trading host
    Value: !Ref LiveTradingInstance
  PublicIp:
    Description: Public IPv4 address of the Live Trading EC2 instance
    Value: !GetAtt LiveTradingInstance.PublicIp
  EcrRepositoryUri:
    Description: Amazon ECR Repository URI for pushing the Live Trading Docker image
    Value: !GetAtt LiveTradingEcrRepository.RepositoryUri
  EbsVolumeId:
    Description: Persistent gp3 EBS Volume ID mounted at /mnt/ebs/polymarket-data
    Value: !Ref LiveTradingEbsVolume
  LogGroupName:
    Description: CloudWatch Logs log group receiving Live Trading container and host logs
    Value: !Ref LiveTradingLogGroup
