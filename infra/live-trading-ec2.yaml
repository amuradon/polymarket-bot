AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Polymarket Bot Live Trading Compute Infrastructure in eu-west-1 (Dublin). Provisions a 24/7 c8gn.xlarge
  EC2 instance (4 vCPU Graviton4 ARM64, 30 Gbps Enhanced Networking) with host-networked Docker,
  non-blocking awslogs streaming, kernel TCP buffer tuning, and IMDSv2 token enforcement, referencing
  the Live Trading Base Infrastructure stack.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  BaseStackName:
    Type: String
    Default: polymarket-bot-live-base
    Description: Name of the Live Trading Base Infrastructure CloudFormation stack exporting network, IAM, and log group resources.

  InstanceType:
    Type: String
    Default: c8gn.xlarge
    Description: EC2 instance type (arm64 / Graviton4 4 vCPU + 30 Gbps ENA) for running the 4-Core Quarkus Live Trading Engine.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Latest Amazon Linux 2023 arm64 AMI ID from SSM Parameter Store.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0b1537e6f83a86b05
    Description: Public subnet ID in eu-west-1a for the Live Trading EC2 instance.

  PolymarketSecretId:
    Type: String
    Default: polymarket-sniper/clob-credentials
    Description: AWS Secrets Manager secret ID storing Polymarket CLOB L2 and EIP-712 signing credentials.

Resources:
  LiveTradingInstance:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: 24/7 c8gn.xlarge EC2 host in eu-west-1 running the 4-Core Dockerized Quarkus Live Trading Engine with --network host, non-blocking CloudWatch logging, and IMDSv2 hop limit 2.
        must: Enforce IMDSv2 (HttpTokens required, HttpPutResponseHopLimit 2) and ship container and host logs to CloudWatch Logs without blocking stdout.
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      AvailabilityZone: !Sub "${AWS::Region}a"
      SubnetId: !Ref SubnetId
      IamInstanceProfile:
        Fn::ImportValue: !Sub "${BaseStackName}-InstanceProfileName"
      SecurityGroupIds:
        - Fn::ImportValue: !Sub "${BaseStackName}-SecurityGroupId"
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euxo pipefail
              dnf update -y
              dnf install -y docker jq awscli amazon-cloudwatch-agent iptables

              # Configure Docker daemon
              mkdir -p /etc/docker
              cat << 'EOF' > /etc/docker/daemon.json
              {
                "log-driver": "json-file",
                "log-opts": {
                  "max-size": "50m",
                  "max-file": "3"
                }
              }
              EOF

              systemctl enable --now docker
              usermod -aG docker ec2-user || true

              # Configure Amazon CloudWatch Agent for host bootstrap and system logs
              mkdir -p /opt/aws/amazon-cloudwatch-agent/etc
              cat << 'EOF' > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
              {
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {
                          "file_path": "/var/log/cloud-init-output.log",
                          "log_group_name": "${LogGroupName}",
                          "log_stream_name": "{instance_id}/cloud-init-output"
                        },
                        {
                          "file_path": "/var/log/messages",
                          "log_group_name": "${LogGroupName}",
                          "log_stream_name": "{instance_id}/messages"
                        }
                      ]
                    }
                  }
                }
              }
              EOF
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                -a fetch-config -m ec2 \
                -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

              # Tune Linux kernel TCP receive buffer auto-tuning for high-frequency Polymarket CLOB WebSocket bursts
              cat << 'EOF' > /etc/sysctl.d/99-polymarket-network.conf
              net.core.rmem_default = 16777216
              net.core.rmem_max = 33554432
              net.ipv4.tcp_rmem = 4096 16777216 33554432
              net.ipv4.tcp_moderate_rcvbuf = 1
              EOF
              sysctl --system || true

              # Forward inbound TCP port 443 to Quarkus HTTP port 8080 when running with --network host
              iptables -t nat -C PREROUTING -p tcp --dport 443 -j REDIRECT --to-port 8080 2>/dev/null || \
                iptables -t nat -A PREROUTING -p tcp --dport 443 -j REDIRECT --to-port 8080
              iptables -t nat -C OUTPUT -p tcp -o lo --dport 443 -j REDIRECT --to-port 8080 2>/dev/null || \
                iptables -t nat -A OUTPUT -p tcp -o lo --dport 443 -j REDIRECT --to-port 8080

              # Create helper launch script for 24/7 container execution with --network host and non-blocking CloudWatch Logs
              cat << 'EOF' > /usr/local/bin/start-polymarket-live.sh
              #!/bin/bash
              set -euo pipefail
              IMAGE_URI="${!1:-polymarket-bot/live:latest}"
              iptables -t nat -C PREROUTING -p tcp --dport 443 -j REDIRECT --to-port 8080 2>/dev/null || \
                iptables -t nat -A PREROUTING -p tcp --dport 443 -j REDIRECT --to-port 8080
              docker rm -f polymarket-live || true
              docker run -d \
                --name polymarket-live \
                --restart unless-stopped \
                --network host \
                --log-driver=awslogs \
                --log-opt awslogs-region="${AWS::Region}" \
                --log-opt awslogs-group="${LogGroupName}" \
                --log-opt awslogs-stream="polymarket-live" \
                --log-opt mode=non-blocking \
                --log-opt max-buffer-size=16m \
                -e QUARKUS_PROFILE="prod" \
                -e AWS_REGION="${AWS::Region}" \
                -e POLYMARKET_CREDENTIALS_SECRET_ID="${PolymarketSecretId}" \
                -e POLYMARKET_STRATEGY_NAME="UtterParameciumStrategy" \
                "$IMAGE_URI"
              EOF
              chmod +x /usr/local/bin/start-polymarket-live.sh
            - LogGroupName:
                Fn::ImportValue: !Sub "${BaseStackName}-LogGroupName"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance"

Outputs:
  InstanceId:
    Description: EC2 Instance ID of the Live Trading host
    Value: !Ref LiveTradingInstance
    Export:
      Name: !Sub "${AWS::StackName}-InstanceId"
  PublicIp:
    Description: Public IPv4 address of the Live Trading EC2 instance
    Value: !GetAtt LiveTradingInstance.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-PublicIp"
