quarkus.application.name=polymarket-bot-paper
quarkus.http.port=${PORT:8080}
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} [%p] [%c{2.}] (%t) %s%e%n
quarkus.index-dependency.common.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.common.artifact-id=common
quarkus.index-dependency.connector.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.connector.artifact-id=connector
quarkus.index-dependency.trading.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.trading.artifact-id=trading
quarkus.secretsmanager.devservices.enabled=false
quarkus.secretsmanager.config.enabled=false
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED

polymarket.strategy.name=UtterParameciumStrategy
polymarket.paper.symbol=BTCUSDT
polymarket.paper.streams-enabled=true
polymarket.paper.data-dir=${POLYMARKET_PAPER_DATA_DIR:data/paper}
polymarket.paper.initial-capital=10000.0
polymarket.paper.order-latency-ms=50

polymarket.connector.binance.spot-ws-base-url=wss://stream.binance.com:9443/ws
polymarket.connector.kraken.spot-ws-url=wss://ws.kraken.com/v2
polymarket.connector.coinbase.spot-ws-url=wss://ws-feed.exchange.coinbase.com
polymarket.connector.ws.reconnect-delay-ms=3000
polymarket.connector.ws.ping-interval-ms=10000

%test.quarkus.http.test-port=0
%test.quarkus.scheduler.enabled=false
%test.polymarket.paper.streams-enabled=false
