quarkus.application.name=polymarket-bot-paper
quarkus.http.port=${PORT:8080}
quarkus.index-dependency.common.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.common.artifact-id=common
quarkus.index-dependency.connector.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.connector.artifact-id=connector
quarkus.index-dependency.trading.group-id=cz.amuradon.polymarket.bot
quarkus.index-dependency.trading.artifact-id=trading
quarkus.secretsmanager.devservices.enabled=false
quarkus.secretsmanager.config.enabled=false

polymarket.strategy.name=TWAPArbitrageStrategy
polymarket.paper.data-dir=${POLYMARKET_PAPER_DATA_DIR:data/paper}
polymarket.paper.initial-capital=10000.0
polymarket.paper.order-latency-ms=50
