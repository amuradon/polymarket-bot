quarkus.application.name=polymarket-bot-live
quarkus.http.port=8080

# Trading Mode & Strategy (First deployed strategy: UtterParameciumStrategy)
polymarket.trading.mode=live
polymarket.strategy.name=UtterParameciumStrategy

# Live Engine Configuration
polymarket.live.symbol=BTCUSDT
polymarket.live.timeframe=15m
polymarket.live.data-dir=data/live
polymarket.live.initial-capital=100.0
polymarket.live.streams-enabled=true
polymarket.live.dry-run=false
polymarket.live.order-type=FAK
polymarket.live.discovery-interval=5s
polymarket.live.keepalive-interval=15s

# Quarkus Amazon Secrets Manager (quarkus-amazon-secretsmanager)
quarkus.secretsmanager.devservices.enabled=false
%prod.quarkus.secretsmanager.region=eu-west-1
%prod.quarkus.secretsmanager.aws.credentials.type=default
%prod.quarkus.secretsmanager.config.enabled=true
%prod.quarkus.secretsmanager.config.secrets."polymarket.secrets"=polymarket-sniper/clob-credentials
%dev.quarkus.secretsmanager.config.enabled=false
%test.quarkus.secretsmanager.config.enabled=false

# Polymarket Connector Credentials & Endpoints
polymarket.connector.signer-key=${polymarket.secrets.signer_key}
polymarket.connector.api-key=${polymarket.secrets.api_key}
polymarket.connector.passphrase=${polymarket.secrets.passphrase}
polymarket.connector.secret=${polymarket.secrets.secret}
polymarket.connector.address=${polymarket.secrets.address}
polymarket.connector.gamma.base-url=https://gamma-api.polymarket.com
polymarket.connector.clob.rest-url=https://clob.polymarket.com
polymarket.connector.clob.ws-url=wss://ws-subscriptions-clob.polymarket.com/ws/market
polymarket.connector.polybolt.ws-url=wss://ws-live-v2.polymarket.com/ws
polymarket.connector.ws.reconnect-delay-ms=3000
polymarket.connector.ws.ping-interval-ms=10000

# Test profile overrides (100% synthetic, offline)
%test.quarkus.http.test-port=0
%test.quarkus.scheduler.enabled=false
%test.polymarket.live.streams-enabled=false
%test.polymarket.live.dry-run=true
%test.polymarket.live.data-dir=target/test-live-data
