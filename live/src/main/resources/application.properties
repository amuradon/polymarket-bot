quarkus.application.name=polymarket-bot-live
quarkus.http.port=${PORT:8080}

# Trading Mode & Strategy (First deployed strategy: UtterParameciumStrategy)
polymarket.trading.mode=live
polymarket.strategy.name=${POLYMARKET_STRATEGY_NAME:UtterParameciumStrategy}

# Live Engine Configuration
polymarket.live.symbol=${POLYMARKET_LIVE_SYMBOL:BTCUSDT}
polymarket.live.timeframe=${POLYMARKET_LIVE_TIMEFRAME:15m}
polymarket.live.data-dir=${POLYMARKET_LIVE_DATA_DIR:data/live}
polymarket.live.initial-capital=${POLYMARKET_LIVE_INITIAL_CAPITAL:100.0}
polymarket.live.streams-enabled=${POLYMARKET_LIVE_STREAMS_ENABLED:true}
polymarket.live.dry-run=${POLYMARKET_LIVE_DRY_RUN:false}
polymarket.live.order-type=${POLYMARKET_LIVE_ORDER_TYPE:FAK}
polymarket.live.discovery-interval=5s
polymarket.live.keepalive-interval=15s

# Quarkus Amazon Secrets Manager (quarkus-amazon-secretsmanager)
# - prod profile: reads polymarket-sniper/clob-credentials from AWS Secrets Manager in eu-west-1
# - dev and test profiles: Secrets Manager is disabled; secrets are read from JVM arguments (-D...) or env variables
quarkus.secretsmanager.devservices.enabled=false
%prod.quarkus.secretsmanager.region=${AWS_REGION:eu-west-1}
%prod.quarkus.secretsmanager.aws.credentials.type=default
%prod.quarkus.secretsmanager.config.enabled=true
%prod.quarkus.secretsmanager.config.secrets."polymarket.secrets"=${POLYMARKET_CREDENTIALS_SECRET_ID:polymarket-sniper/clob-credentials}
%dev.quarkus.secretsmanager.config.enabled=false
%test.quarkus.secretsmanager.config.enabled=false

# Polymarket Connector Credentials & Endpoints
polymarket.connector.signer-key=${POLYMARKET_SIGNER_KEY:${POLYMARKET_PRIVATE_KEY:${polymarket.secrets.signer_key:${polymarket.secrets.POLYMARKET_PRIVATE_KEY:${polymarket.secrets.POLYMARKET_SIGNER_KEY:}}}}}
polymarket.connector.api-key=${POLYMARKET_API_KEY:${polymarket.secrets.api_key:${polymarket.secrets.POLYMARKET_API_KEY:}}}
polymarket.connector.passphrase=${POLYMARKET_PASSPHRASE:${polymarket.secrets.passphrase:${polymarket.secrets.POLYMARKET_PASSPHRASE:}}}
polymarket.connector.secret=${POLYMARKET_SECRET:${polymarket.secrets.secret:${polymarket.secrets.POLYMARKET_SECRET:}}}
polymarket.connector.address=${POLYMARKET_ADDRESS:${POLYMARKET_MAKER_ADDRESS:${polymarket.secrets.address:${polymarket.secrets.POLYMARKET_ADDRESS:${polymarket.secrets.POLYMARKET_MAKER_ADDRESS:}}}}}
polymarket.connector.maker-address=${POLYMARKET_MAKER_ADDRESS:${POLYMARKET_ADDRESS:${polymarket.secrets.maker_address:${polymarket.secrets.address:${polymarket.secrets.POLYMARKET_MAKER_ADDRESS:}}}}}
polymarket.connector.signer-address=${POLYMARKET_SIGNER_ADDRESS:${polymarket.secrets.signer_address:${polymarket.secrets.POLYMARKET_SIGNER_ADDRESS:}}}
polymarket.connector.gamma.base-url=https://gamma-api.polymarket.com
polymarket.connector.clob.rest-url=https://clob.polymarket.com
polymarket.connector.clob.ws-url=wss://ws-subscriptions-clob.polymarket.com/ws/market
polymarket.connector.polybolt.ws-url=wss://ws-live-v2.polymarket.com/ws
polymarket.connector.ws.reconnect-delay-ms=3000
polymarket.connector.ws.ping-interval-ms=10000

# Test profile overrides (100% synthetic, offline)
%test.quarkus.http.test-port=0
%test.quarkus.scheduler.enabled=false
%test.polymarket.live.streams-enabled=false
%test.polymarket.live.dry-run=true
%test.polymarket.live.data-dir=target/test-live-data
